server:
  port: 8080

spring:
  application:
    name: ecommerce-admin-agent

  datasource:
    # 业务管理中台主数据源（具备商品/订单管理与配置的读写权限）
    url: jdbc:postgresql://localhost:5432/olist
    username: text2sql
    password: text2sql
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  # 显式关闭 Spring AI 的全局自动注入模型（避免启动时因未配 Key 导致容器启动失败）
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

agent:
  db:
    max-rows: 200
    query-timeout-seconds: 10

  guard:
    limit-mode: APPEND

  llm:
    provider: openai-compatible
    base-url: https://api.deepseek.com
    completions-path: /v1/chat/completions
    model: deepseek-chat
    temperature: 0.0
    max-tokens: 1024
    timeout-seconds: 60
    api-key: ${AGENT_LLM_API_KEY:}
    input-price-per-1k: 0.0
    output-price-per-1k: 0.0

  prompt:
    include-data-profile: true
    include-foreign-keys: true

  retrieval:
    enabled: true
    top-k: 8
    relation-hops: 1
    relation-decay: 0.4
    expansion-seed-limit: 3
    single-char-weight-factor: 0.5
    bridge-repair-enabled: true
    bridge-repair-max-tables: 2
    identifier-hit-weight: 1.5

  fewshot:
    enabled: false
    max-examples: 3

  result-checker:
    enabled: false

  tool-use:
    enabled: false
    table-threshold: 3
    max-rounds: 3

  conversation:
    enabled: true
    max-turns: 5
    timeout-minutes: 30
    reuse-schema: true
    rewrite-with-llm: true

  clarification:
    enabled: false

  self-correction:
    enabled: false
    max-attempts: 1

  cache:
    enabled: false
    max-entries: 1000

  persistence:
    enabled: false
    url: jdbc:postgresql://localhost:5432/olist
    username: text2sql_rw
    password: text2sql_rw

  observability:
    enabled: false
    dir: reports/llm-calls
    include-content: false

  routing:
    enabled: false
    escalation-model: ""

  eval:
    enabled: false
    dir: data/eval
    out-dir: reports
    limit: 0
    layers: []
    dry-run: false
    recompute-gold: true

logging:
  level:
    root: INFO
    com.ecommerce.platform: INFO
    com.text2sql.agent: INFO
